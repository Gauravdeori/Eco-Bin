<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="EcoBin">
  <title>EcoBin</title>
  <!-- Brand mark: the EcoLogo bin-and-leaf glyph on the app's primary green.
